<!--
  Panther AI Assistant Panel — Standalone vanilla component
  
  Usage:
    1. Include panther.css in <head>
    2. Paste this <section> into your page template
    3. Include panther.js before </body>
    
  Compatible with any Python backend (Flask, Django, FastAPI, etc.)
-->

<section class="panther-hero" aria-label="Panther AI assistant">

  <!-- Decorative scene background — all aria-hidden -->
  <div class="panther-scene-backdrop" aria-hidden="true">
    <div class="panther-glow-orb"></div>
    <svg class="panther-scene-curves" viewBox="0 0 800 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 300 Q200 250 400 280 T800 240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
      <path d="M0 340 Q250 290 500 320 T800 280" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
      <path d="M0 200 Q300 180 600 220 T800 180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <circle cx="120" cy="80" r="40" fill="rgba(255,255,255,0.02)"/>
      <circle cx="680" cy="100" r="55" fill="rgba(255,255,255,0.015)"/>
      <circle cx="600" cy="320" r="30" fill="rgba(255,255,255,0.02)"/>
      <ellipse cx="200" cy="350" rx="60" ry="25" fill="rgba(255,255,255,0.015)"/>
    </svg>
    <div class="panther-vignette"></div>
  </div>

  <!-- Character block — centered above chat -->
  <div class="panther-character-block">

    <!-- Panther Avatar SVG — inline, decorative -->
    <svg class="panther-avatar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false" role="presentation">
      <g class="panther-body-group">
        <g class="panther-head-group">
          <!-- Head — angular diamond -->
          <path d="M150 22 L185 32 Q225 48 248 80 Q262 102 260 120 Q258 142 245 158 Q225 178 195 188 Q170 195 150 196 Q130 195 105 188 Q75 178 55 158 Q42 142 40 120 Q38 102 52 80 Q75 48 115 32 L150 22 Z" fill="#2d2d45"/>
          <!-- Left ear — large -->
          <g class="panther-left-ear">
            <ellipse cx="42" cy="55" rx="28" ry="26" fill="#2d2d45"/>
            <ellipse cx="42" cy="55" rx="18" ry="16" fill="#4a3f6b" opacity="0.6"/>
            <circle cx="48" cy="47" r="4" fill="#5a5080" opacity="0.5"/>
          </g>
          <!-- Right ear — large -->
          <g class="panther-right-ear">
            <ellipse cx="258" cy="48" rx="28" ry="26" fill="#2d2d45"/>
            <ellipse cx="258" cy="48" rx="18" ry="16" fill="#4a3f6b" opacity="0.6"/>
            <circle cx="264" cy="40" r="4" fill="#5a5080" opacity="0.5"/>
          </g>
          <!-- Eyes -->
          <g class="panther-eye-group">
            <g>
              <ellipse cx="120" cy="82" rx="28" ry="26" fill="#dbeafe"/>
              <ellipse cx="120" cy="84" rx="20" ry="20" fill="#60a5fa"/>
              <circle cx="120" cy="86" r="10" fill="#0a0f1f"/>
              <circle cx="127" cy="76" r="5" fill="#ffffff" opacity="0.92"/>
              <circle cx="114" cy="90" r="2.2" fill="#ffffff" opacity="0.35"/>
              <ellipse cx="120" cy="82" rx="29" ry="27" fill="#2d2d45" class="panther-eyelid" style="transform-origin: 120px 82px;"/>
            </g>
            <g>
              <ellipse cx="180" cy="82" rx="28" ry="26" fill="#dbeafe"/>
              <ellipse cx="180" cy="84" rx="20" ry="20" fill="#60a5fa"/>
              <circle cx="180" cy="86" r="10" fill="#0a0f1f"/>
              <circle cx="187" cy="76" r="5" fill="#ffffff" opacity="0.92"/>
              <circle cx="174" cy="90" r="2.2" fill="#ffffff" opacity="0.35"/>
              <ellipse cx="180" cy="82" rx="29" ry="27" fill="#2d2d45" class="panther-eyelid" style="transform-origin: 180px 82px;"/>
            </g>
          </g>
          <!-- Eye bridge -->
          <path d="M140 90 Q150 85 160 90" fill="none" stroke="#2d2d45" stroke-width="4" stroke-linecap="round"/>
          <!-- Eyebrows -->
          <rect x="96" y="48" width="28" height="10" rx="2" fill="#1a1a2e" transform="rotate(-8, 110, 53)"/>
          <rect x="174" y="48" width="28" height="10" rx="2" fill="#1a1a2e" transform="rotate(8, 188, 53)"/>
          <!-- Outer muzzle -->
          <path d="M90 120 Q95 105 120 100 Q140 96 150 95 Q160 96 180 100 Q205 105 210 120 Q215 140 205 158 Q190 175 150 178 Q110 175 95 158 Q85 140 90 120 Z" fill="#3a3a55"/>
          <!-- Inner muzzle -->
          <path d="M108 124 Q118 114 150 112 Q182 114 192 124 Q196 140 192 152 Q182 164 150 166 Q118 164 108 152 Q104 140 108 124 Z" fill="#4a4a65"/>
          <!-- Nose -->
          <path d="M140 126 L150 118 L160 126 Q156 132 150 134 Q144 132 140 126 Z" fill="#1a1a2e"/>
          <!-- Nose to mouth -->
          <path d="M150 134 L150 142" fill="none" stroke="#1a1a2e" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Mouth -->
          <path d="M122 150 Q135 158 150 158 Q165 158 178 150" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M122 150 Q117 146 114 140" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
          <path d="M178 150 Q183 147 185 142" fill="none" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Left whiskers -->
          <path d="M92 132 Q60 124 15 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
          <path d="M90 145 Q55 142 10 150" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M92 158 Q58 162 18 172" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Right whiskers -->
          <path d="M208 132 Q240 124 285 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
          <path d="M210 145 Q245 142 290 150" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M208 158 Q242 162 282 172" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>
    </svg>

    <span class="panther-name">Panther</span>
    <span class="panther-status">
      <span class="panther-status-dot" aria-hidden="true"></span>
      <span>Online</span>
    </span>
  </div>

  <!-- Message history -->
  <div class="panther-message-log" role="log" aria-live="polite" aria-label="Panther conversation">
    <div class="panther-bubble panther-bubble--assistant">
      Hello! I'm Panther, your learning assistant. How can I help you today?
    </div>
  </div>

  <!-- Suggested prompt chips -->
  <div class="panther-chips" aria-label="Suggested prompts">
    <button type="button" class="panther-chip" data-prompt="What should I study next?">What should I study next?</button>
    <button type="button" class="panther-chip" data-prompt="Explain my progress">Explain my progress</button>
    <button type="button" class="panther-chip" data-prompt="Quiz me on this module">Quiz me on this module</button>
    <button type="button" class="panther-chip" data-prompt="Summarize last session">Summarize last session</button>
  </div>

  <!-- Input area -->
  <form class="panther-input-row" id="panther-form" novalidate>
    <label for="panther-input" class="panther-sr-only">Message Panther</label>
    <input
      id="panther-input"
      type="text"
      class="panther-text-input"
      placeholder="Ask Panther anything..."
      autocomplete="off"
    />
    <button type="submit" class="panther-send-btn" aria-label="Send message">
      Send
    </button>
  </form>

</section>
