<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false" role="presentation">
  <!-- Panther Avatar — Pink Panther style, dark navy colors
       Fixes: angular diamond head (NOT round), large prominent ears -->

  <g class="panther-body-group">
    <g class="panther-head-group">

      <!-- Head — angular diamond/rhombus shape
           Wide at cheeks, narrow at top & chin, flat sides
           NOT a circle. Think wide horizontal diamond with soft corners -->
      <path d="M150 22
               L185 32
               Q225 48 248 80
               Q262 102 260 120
               Q258 142 245 158
               Q225 178 195 188
               Q170 195 150 196
               Q130 195 105 188
               Q75 178 55 158
               Q42 142 40 120
               Q38 102 52 80
               Q75 48 115 32
               L150 22 Z"
            fill="#2d2d45"/>

      <!-- Left ear — LARGE, round, clearly visible -->
      <g class="panther-left-ear">
        <ellipse cx="42" cy="55" rx="28" ry="26" fill="#2d2d45"/>
        <ellipse cx="42" cy="55" rx="18" ry="16" fill="#4a3f6b" opacity="0.6"/>
        <circle cx="48" cy="47" r="4" fill="#5a5080" opacity="0.5"/>
      </g>

      <!-- Right ear — LARGE, round -->
      <g class="panther-right-ear">
        <ellipse cx="258" cy="48" rx="28" ry="26" fill="#2d2d45"/>
        <ellipse cx="258" cy="48" rx="18" ry="16" fill="#4a3f6b" opacity="0.6"/>
        <circle cx="264" cy="40" r="4" fill="#5a5080" opacity="0.5"/>
      </g>

      <!-- Eye group — large, overlapping at center -->
      <g class="panther-eye-group">
        <!-- Left eye -->
        <g>
          <ellipse cx="120" cy="82" rx="28" ry="26" fill="#dbeafe"/>
          <ellipse cx="120" cy="84" rx="20" ry="20" fill="#60a5fa"/>
          <circle cx="120" cy="86" r="10" fill="#0a0f1f"/>
          <circle cx="127" cy="76" r="5" fill="#ffffff" opacity="0.92"/>
          <circle cx="114" cy="90" r="2.2" fill="#ffffff" opacity="0.35"/>
          <ellipse cx="120" cy="82" rx="29" ry="27" fill="#2d2d45"
                   class="panther-eyelid" style="transform-origin: 120px 82px;"/>
        </g>
        <!-- Right eye -->
        <g>
          <ellipse cx="180" cy="82" rx="28" ry="26" fill="#dbeafe"/>
          <ellipse cx="180" cy="84" rx="20" ry="20" fill="#60a5fa"/>
          <circle cx="180" cy="86" r="10" fill="#0a0f1f"/>
          <circle cx="187" cy="76" r="5" fill="#ffffff" opacity="0.92"/>
          <circle cx="174" cy="90" r="2.2" fill="#ffffff" opacity="0.35"/>
          <ellipse cx="180" cy="82" rx="29" ry="27" fill="#2d2d45"
                   class="panther-eyelid" style="transform-origin: 180px 82px;"/>
        </g>
      </g>

      <!-- Eye bridge -->
      <path d="M140 90 Q150 85 160 90" fill="none" stroke="#2d2d45" stroke-width="4" stroke-linecap="round"/>

      <!-- Eyebrows — thick blocks -->
      <rect x="96" y="48" width="28" height="10" rx="2" fill="#1a1a2e" transform="rotate(-8, 110, 53)"/>
      <rect x="174" y="48" width="28" height="10" rx="2" fill="#1a1a2e" transform="rotate(8, 188, 53)"/>

      <!-- Outer muzzle — wide -->
      <path d="M90 120
               Q95 105 120 100
               Q140 96 150 95
               Q160 96 180 100
               Q205 105 210 120
               Q215 140 205 158
               Q190 175 150 178
               Q110 175 95 158
               Q85 140 90 120 Z"
            fill="#3a3a55"/>

      <!-- Inner muzzle — lighter -->
      <path d="M108 124
               Q118 114 150 112
               Q182 114 192 124
               Q196 140 192 152
               Q182 164 150 166
               Q118 164 108 152
               Q104 140 108 124 Z"
            fill="#4a4a65"/>

      <!-- Nose -->
      <path d="M140 126 L150 118 L160 126 Q156 132 150 134 Q144 132 140 126 Z" fill="#1a1a2e"/>

      <!-- Nose to mouth -->
      <path d="M150 134 L150 142" fill="none" stroke="#1a1a2e" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Mouth -->
      <path d="M122 150 Q135 158 150 158 Q165 158 178 150" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M122 150 Q117 146 114 140" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
      <path d="M178 150 Q183 147 185 142" fill="none" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Left whiskers -->
      <path d="M92 132 Q60 124 15 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <path d="M90 145 Q55 142 10 150" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M92 158 Q58 162 18 172" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Right whiskers -->
      <path d="M208 132 Q240 124 285 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
      <path d="M210 145 Q245 142 290 150" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M208 158 Q242 162 282 172" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>

    </g>
  </g>
</svg>
